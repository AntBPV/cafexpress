spring.application.name=cafexpress-backend

# Servidor
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafexpress}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Estado del backend
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Autenticacion
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=cafexpress-backend
app.jwt.audience=cafexpress-app
app.jwt.duration-seconds=3600

# Origen permitido para Flutter web
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5300}