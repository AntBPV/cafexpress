spring.application.name=cafexpress-backend

# Servidor
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafexpress}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Paginacion de productos
spring.data.web.pageable.max-page-size=100

# Migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# Estado del backend
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Autenticacion
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=cafexpress-backend
app.jwt.audience=cafexpress-app
app.jwt.duration-seconds=3600

# Origen permitido para Flutter web
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5300}

# Open-Meteo
app.open-meteo.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
app.open-meteo.daily-variables=${OPEN_METEO_DAILY_VARIABLES:temperature_2m_max,temperature_2m_min,rain_sum}
app.open-meteo.current-variables=${OPEN_METEO_CURRENT_VARIABLES:relative_humidity_2m,temperature_2m}
app.open-meteo.timezone=${OPEN_METEO_TIMEZONE:auto}

# Rangos climaticos de referencia para el cultivo de cafe
app.alerta.cafe.temperatura-minima=${CAFE_TEMPERATURA_MINIMA:18}
app.alerta.cafe.temperatura-maxima=${CAFE_TEMPERATURA_MAXIMA:24}
app.alerta.cafe.lluvia-minima=${CAFE_LLUVIA_MINIMA:2}
app.alerta.cafe.lluvia-maxima=${CAFE_LLUVIA_MAXIMA:10}